<?xml version="1.0"?>
<!-- Fixture: a user overlay. Replaces `snes` by name and adds a system that is not in the base file. -->
<systemList>
  <system>
    <name>snes</name>
    <fullname>Super Famicom</fullname>
    <manufacturer>Nintendo</manufacturer>
    <release>1990</release>
    <hardware>console</hardware>
    <path>/userdata/roms/snes</path>
    <extension>.sfc .smc .zip</extension>
    <command>emulatorlauncher %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
    <platform>snes</platform>
    <theme>snes</theme>
    <emulators>
      <emulator name="libretro">
        <cores>
          <core default="true">bsnes</core>
        </cores>
      </emulator>
    </emulators>
  </system>
  <system>
    <name>homebrew</name>
    <fullname>Homebrew</fullname>
    <path>/userdata/roms/homebrew</path>
    <extension>.nes .gb</extension>
    <command>emulatorlauncher %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
    <platform>nes</platform>
    <theme>homebrew</theme>
  </system>
</systemList>
