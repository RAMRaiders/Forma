<?xml version="1.0" encoding="UTF-8" ?>
<!-- A cut-down es_features.cfg in Batocera's format, for the fixture systems. -->
<features>
  <sharedFeatures>
    <feature name="VIDEO MODE" value="videomode" description="Set the display's resolution." preset="videomodes">
    </feature>
    <feature name="GAME ASPECT RATIO" value="ratio" description="Force the game to render in this aspect ratio.">
      <choice name="4/3" value="4/3" />
      <choice name="16/9" value="16/9" />
      <choice name="Core provided" value="core" />
    </feature>
    <feature name="REWIND" value="rewind" description="Store past states to rewind to in realtime.">
      <choice name="On" value="1" />
      <choice name="Off" value="0" />
    </feature>
    <feature name="SHADER SET" submenu="GAME RENDERING &amp; SHADERS" value="shaderset" preset="shaderset">
    </feature>
    <feature name="INTEGER SCALING (PIXEL PERFECT)" submenu="GAME RENDERING &amp; SHADERS" value="integerscale" preset="switchauto">
    </feature>
    <feature name="DECORATION SET" submenu="DECORATIONS" value="bezel" preset="bezel">
    </feature>
    <feature name="RUMBLE STRENGTH" group="CONTROLS" value="rumble_gain" description="Rumble strength, in percent." preset="slider" preset-parameters="0 100 5 100">
    </feature>
    <feature name="AI TRANSLATION SERVICE URL" submenu="AI GAME TRANSLATION" value="ai_service_url" preset="input">
    </feature>
    <feature name="SOMETHING NEWER" value="future" preset="hologram">
    </feature>
  </sharedFeatures>
  <globalFeatures>
    <sharedFeature value="videomode" />
    <sharedFeature value="ratio" />
    <sharedFeature value="shaderset" />
    <sharedFeature value="integerscale" />
    <sharedFeature value="bezel" />
    <sharedFeature value="rewind" />
    <sharedFeature value="rumble_gain" />
    <sharedFeature value="ai_service_url" />
    <sharedFeature value="future" />
  </globalFeatures>
  <emulator name="libretro" features="">
    <sharedFeature value="videomode" />
    <sharedFeature value="ratio" />
    <sharedFeature value="shaderset" />
    <cores>
      <core name="fceumm" features="netplay, cheevos">
        <sharedFeature value="rewind" />
        <feature name="PALETTE" group="ADVANCED OPTIONS" value="fceumm_palette" description="Colour palette.">
          <choice name="Default" value="default" />
          <choice name="Real" value="real" />
        </feature>
      </core>
      <core name="snes9x" features="netplay, cheevos">
        <sharedFeature value="rewind" />
        <feature name="SUPER FX OVERCLOCK" group="ADVANCED OPTIONS" value="overclock_superfx" description="Reduces slowdown in mode 7 games.">
          <choice name="100%" value="100%" />
          <choice name="200%" value="200%" />
        </feature>
      </core>
      <core name="swanstation" features="cheevos">
        <feature name="INTERNAL RESOLUTION" group="ADVANCED OPTIONS" value="swanstation_resolution" preset="sliderauto" preset-parameters="1 16 1">
        </feature>
        <systems>
          <system name="psx" features="">
            <feature name="PGXP" group="ADVANCED OPTIONS" value="swanstation_pgxp" preset="switchauto">
            </feature>
          </system>
        </systems>
      </core>
    </cores>
  </emulator>
  <emulator name="duckstation" features="cheevos">
    <sharedFeature value="videomode" />
    <feature name="RENDERER" group="ADVANCED OPTIONS" value="duckstation_gfxbackend" description="Graphics backend.">
      <choice name="OpenGL" value="OpenGL" />
      <choice name="Vulkan" value="Vulkan" />
    </feature>
  </emulator>
</features>
