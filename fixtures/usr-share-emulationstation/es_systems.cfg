<?xml version="1.0"?>
<!-- Fixture: a trimmed copy of the shape of Batocera's /usr/share/emulationstation/es_systems.cfg -->
<systemList>
  <system>
    <name>nes</name>
    <fullname>Nintendo Entertainment System</fullname>
    <manufacturer>Nintendo</manufacturer>
    <release>1985</release>
    <hardware>console</hardware>
    <path>/userdata/roms/nes</path>
    <extension>.nes .NES .unif .zip .ZIP .7z</extension>
    <command>emulatorlauncher %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
    <platform>nes</platform>
    <theme>nes</theme>
    <emulators>
      <emulator name="libretro">
        <cores>
          <core default="true">fceumm</core>
          <core>nestopia</core>
          <core>mesen</core>
        </cores>
      </emulator>
    </emulators>
  </system>
  <system>
    <name>snes</name>
    <fullname>Super Nintendo</fullname>
    <manufacturer>Nintendo</manufacturer>
    <release>1990</release>
    <hardware>console</hardware>
    <path>/userdata/roms/snes</path>
    <extension>.smc .sfc .SMC .SFC .zip .7z</extension>
    <command>emulatorlauncher %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
    <platform>snes</platform>
    <theme>snes</theme>
    <emulators>
      <emulator name="libretro">
        <cores>
          <core default="true">snes9x</core>
          <core>bsnes</core>
        </cores>
      </emulator>
    </emulators>
  </system>
  <system>
    <name>megadrive</name>
    <fullname>Mega Drive</fullname>
    <manufacturer>Sega</manufacturer>
    <release>1988</release>
    <hardware>console</hardware>
    <path>/userdata/roms/megadrive</path>
    <extension>.md .gen .bin .zip .7z</extension>
    <command>emulatorlauncher %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
    <platform>megadrive, genesis</platform>
    <theme>megadrive</theme>
    <emulators>
      <emulator name="libretro">
        <cores>
          <core default="true">genesisplusgx</core>
          <core>picodrive</core>
        </cores>
      </emulator>
    </emulators>
  </system>
  <system>
    <name>psx</name>
    <fullname>PlayStation</fullname>
    <manufacturer>Sony</manufacturer>
    <release>1994</release>
    <hardware>console</hardware>
    <path>/userdata/roms/psx</path>
    <extension>.cue .CUE .m3u .M3U .chd .CHD .pbp</extension>
    <command>emulatorlauncher %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
    <platform>psx</platform>
    <theme>psx</theme>
    <emulators>
      <emulator name="libretro">
        <cores>
          <core default="true">swanstation</core>
          <core>pcsx_rearmed</core>
        </cores>
      </emulator>
      <emulator name="duckstation">
        <cores>
          <core>duckstation</core>
        </cores>
      </emulator>
    </emulators>
  </system>
</systemList>
