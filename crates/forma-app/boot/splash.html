<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Forma</title>
    <!--
      Forma's start-up screen, at the first start after boot, in two parts:
      1. Batocera's own splash animation, on its own.
      2. Forma's screen: its logo, the theme about to load and its version, and Forma's and
         Batocera's versions; then the theme.
      Served by Forma (forma://localhost/system/splash.html?…); the query carries the theme's
      address, the versions and whether to play sound.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #dff6ff;
        font-family: 'DejaVu Sans', system-ui, sans-serif;
      }

      section {
        position: fixed;
        inset: 0;
        transition: opacity 400ms ease;
      }

      section.gone {
        opacity: 0;
        pointer-events: none;
      }

      section[hidden] {
        display: none;
      }

      video,
      .still {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      /* Forma's screen. */
      .forma {
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 2.2vh;
        background: radial-gradient(ellipse at 50% 45%, #0a1a2e 0%, #04060c 70%);
        text-align: center;
      }

      .mark {
        height: 22vh;
      }

      .mark rect {
        animation: settle 600ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      .mark rect:nth-of-type(2) {
        animation-delay: 70ms;
      }
      .mark rect:nth-of-type(3) {
        animation-delay: 140ms;
      }
      .mark rect:nth-of-type(4) {
        animation-delay: 210ms;
      }
      .mark rect:nth-of-type(5) {
        animation-delay: 280ms;
      }
      .mark rect:nth-of-type(6) {
        animation-delay: 350ms;
      }
      .mark rect:nth-of-type(7) {
        animation-delay: 460ms;
      }

      @keyframes settle {
        from {
          opacity: 0;
          transform: translateY(-14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .word {
        margin: 0;
        font-family: 'DejaVu Sans Mono', monospace;
        font-size: 6vh;
        font-weight: 700;
        letter-spacing: 0.5em;
        margin-right: -0.5em;
        color: #e8fbff;
      }

      .theme {
        margin: 1vh 0 0;
        font-size: 2.6vh;
        color: #22e4ff;
        letter-spacing: 0.06em;
      }

      .versions {
        margin: 0;
        font-size: 1.7vh;
        color: rgb(223 246 255 / 55%);
        letter-spacing: 0.04em;
      }

      .bar {
        width: 24vh;
        height: 0.35vh;
        margin-top: 1vh;
        border-radius: 1vh;
        background: rgb(34 228 255 / 15%);
        overflow: hidden;
      }

      .bar span {
        display: block;
        width: 30%;
        height: 100%;
        background: #22e4ff;
        animation: scan 1.2s ease-in-out infinite;
      }

      @keyframes scan {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(340%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .mark rect,
        .bar span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <section class="batocera">
      <video src="splash.mp4" playsinline preload="auto"></video>
      <img class="still" src="boot-logo.png" alt="" hidden />
    </section>
    <section class="forma" hidden>
      <img class="mark" src="forma-logo.svg" alt="" />
      <p class="word">FORMA</p>
      <p class="theme"></p>
      <p class="versions"></p>
      <div class="bar"><span></span></div>
    </section>
    <script>
      const query = new URLSearchParams(location.search);
      // A TV that cuts the edges (overscan): everything shrinks into the part it shows, as the
      // theme does with the same setting (display.margins).
      const margins = Math.min(10, Math.max(0, Number(query.get('margins')) || 0));
      if (margins > 0) document.body.style.transform = `scale(${1 - (2 * margins) / 100})`;
      const next = query.get('next') || '';
      const forma = query.get('forma') || '';
      const batocera = query.get('batocera') || '';
      document.querySelector('.theme').textContent = query.get('theme') || '';
      document.querySelector('.versions').textContent = [
        forma && `Forma ${forma}`,
        batocera && `Batocera ${batocera}`
      ]
        .filter(Boolean)
        .join('  ·  ');

      const first = document.querySelector('.batocera');
      const second = document.querySelector('.forma');
      const video = document.querySelector('video');
      const still = document.querySelector('.still');
      let stage = 1;

      // Batocera's part done: Forma's screen, then the theme.
      function formaScreen() {
        if (stage !== 1) return;
        stage = 2;
        video.pause();
        first.classList.add('gone');
        second.hidden = false;
        setTimeout(theme, 2200);
      }

      // To the theme, faded; only to a theme on forma:// (the query must not send it elsewhere).
      function theme() {
        if (stage === 3) return;
        stage = 3;
        second.classList.add('gone');
        setTimeout(() => {
          if (next.startsWith('forma://localhost/theme/')) location.replace(next);
        }, 400);
      }

      // No decoder, no file: Batocera's still logo for a moment instead.
      function noVideo() {
        video.hidden = true;
        still.hidden = false;
        setTimeout(formaScreen, 2000);
      }

      video.addEventListener('ended', formaScreen);
      video.addEventListener('error', noVideo);
      video.muted = query.get('sound') !== '1';
      video.play().catch(() => {
        // Sound refused before any input: play it silent rather than not at all.
        video.muted = true;
        video.play().catch(noVideo);
      });
      // A key skips ahead: the video to Forma's screen, Forma's screen to the theme.
      window.addEventListener('keydown', () => (stage === 1 ? formaScreen() : theme()));
      setTimeout(formaScreen, 12000);
    </script>
  </body>
</html>
