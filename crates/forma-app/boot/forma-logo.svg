<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 130" role="img" aria-label="Forma">
  <!--
    Forma's mark: an F built from blocks, the form put together piece by piece, with its last block
    in a second colour, like a piece about to lock into place.
  -->
  <defs>
    <linearGradient id="forma-body" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#22e4ff" />
      <stop offset="1" stop-color="#3b6dff" />
    </linearGradient>
    <linearGradient id="forma-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2e88" />
      <stop offset="1" stop-color="#b23cff" />
    </linearGradient>
  </defs>
  <g fill="url(#forma-body)">
    <rect x="0" y="0" width="28" height="28" rx="5" />
    <rect x="34" y="0" width="28" height="28" rx="5" />
    <rect x="0" y="34" width="28" height="28" rx="5" />
    <rect x="0" y="68" width="28" height="28" rx="5" />
    <rect x="34" y="68" width="28" height="28" rx="5" />
    <rect x="0" y="102" width="28" height="28" rx="5" />
  </g>
  <rect x="68" y="0" width="28" height="28" rx="5" fill="url(#forma-accent)" />
</svg>
