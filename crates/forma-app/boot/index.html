<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Forma</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e0f13;
        color: #e8e9ee;
        font-family: system-ui, sans-serif;
      }
      main {
        display: grid;
        place-content: center;
        height: 100%;
        text-align: center;
        padding: 0 2rem;
      }
      p {
        color: #8a8d99;
        max-width: 40rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No theme could be loaded</h1>
      <p>
        Forma found no theme it can start. Check the themes in /userdata/themes-forma/ — the log
        lists why each one was refused — or reinstall Forma to restore the default theme.
      </p>
    </main>
  </body>
</html>
