[workspace]
resolver = "3"
members = ["crates/forma-core", "crates/forma-app"]
# romdex, vendored by scripts/pin-romdex.sh, is its own workspace.
exclude = ["vendor/romdex"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/RAMRaiders/Forma"
rust-version = "1.99"

[workspace.dependencies]
forma-core = { path = "crates/forma-core" }
gilrs = "0.11.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
notify = "8.2.1"
quick-xml = { version = "0.42.0", features = ["escape-html"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ureq = "3.5.0"
tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2.7.4", features = [] }
tempfile = "3.27.0"
# The WebKitGTK binding Tauri itself uses on Linux (same version), for page-process events.
webkit2gtk = "=2.0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
