[workspace]
resolver = "3"
members = ["crates/romdex"]

[workspace.package]
version = "0.0.0"
edition = "2024"
repository = "https://github.com/RAMRaiders/romdex"
rust-version = "1.99"
publish = false

[workspace.dependencies]
romdex = { path = "crates/romdex" }
cc = "1.10.0"
chd = "0.4.0"
crc32fast = "1.5.3"
md-5 = "0.11.0"
quick-xml = "0.42.0"
sevenz-rust2 = { version = "0.24.2", default-features = false }
zip = { version = "9.2.0", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "lzma"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
sha1 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
