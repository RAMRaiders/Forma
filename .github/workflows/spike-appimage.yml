# Builds Forma for testing on Batocera boxes (#39). Each run replaces the branch's pre-release,
# `spike-<branch>`, with what it built: release files do not count against the Actions storage
# that artifacts fill. Nothing else is tagged or published. See docs/batocera-integration.md.
#
# Every push to `develop` (a merged pull request) builds by itself, so `spike-develop` always
# holds installable AppImages of what is merged there, for both machines. Run by hand, a test
# branch builds the Pi's (aarch64) program alone, with the shell and the themes, as
# forma-aarch64.tar.gz: scripts/batocera/update.sh swaps it into an installed Forma, in minutes
# less than packing an AppImage. `develop`, `main`, or `full` build the AppImages too.
name: Spike AppImage

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      full:
        description: AppImages for x86_64 and aarch64, not only the Pi's update
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: spike-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    name: Pre-release for this commit
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=spike-$(echo '${{ github.ref_name }}' | tr -c 'A-Za-z0-9._\n-' '-')" >> "$GITHUB_OUTPUT"
      - name: Replace the branch's pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "Test build: ${{ github.ref_name }} @ ${GITHUB_SHA::7}" \
            --notes "AppImages of ${GITHUB_SHA} on \`${{ github.ref_name }}\`, for testing on a Batocera box. Replaced by the next run on this branch."

  appimage:
    name: AppImage (${{ matrix.arch }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        # 22.04's glibc (2.35) is older than Batocera's, so what it builds runs there. A test
        # build is for the Pi alone.
        include: ${{ fromJSON((github.ref_name == 'main' || github.ref_name == 'develop' || inputs.full) && '[{"arch":"x86_64","runner":"ubuntu-22.04"},{"arch":"aarch64","runner":"ubuntu-22.04-arm"}]' || '[{"arch":"aarch64","runner":"ubuntu-22.04-arm"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # linuxdeploy is itself an AppImage; do not depend on FUSE being there.
      APPIMAGE_EXTRACT_AND_RUN: 1
      FULL: ${{ github.ref_name == 'main' || github.ref_name == 'develop' || inputs.full }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Cached: installed afresh they took a minute and a half on the arm runner.
      # gstreamer1.0-libav: H.264 and AAC, for game preview videos and Batocera's splash
      # (bundled by bundleMediaFramework; a Pi 5 has no H.264 hardware decoder).
      - name: System libraries (WebKitGTK, gamepads)
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: >-
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev librsvg2-dev
            libayatana-appindicator3-dev libudev-dev file patchelf
            gstreamer1.0-libav gstreamer1.0-plugins-good
          version: ${{ matrix.arch }}-1

      # The cache puts the packages' files back but runs none of their install scripts, so the
      # links Debian's alternatives make were missing: on arm, libblas.so.3 (BLAS and LAPACK
      # are alternatives) was not found, and linuxdeploy's GStreamer plugin failed the bundle.
      # Installing them for real runs those scripts.
      - name: Libraries behind Debian alternatives
        run: sudo apt-get install -y --reinstall libblas3 liblapack3

      - name: Rust, as rust-toolchain.toml pins it
        run: |
          command -v rustup >/dev/null || curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show active-toolchain || "$HOME/.cargo/bin/rustup" toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # Cyber, downloaded from its repository's release at the version in themes/cyber/lock.json
      # and refused if its checksum differs. That repository is private, so this needs the
      # CYBER_TOKEN secret: a fine-grained token with Contents: read on forma-theme-cyber.
      - name: Fetch the pinned themes
        env:
          GH_TOKEN: ${{ secrets.CYBER_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set the CYBER_TOKEN secret (Contents: read on RAMRaiders/forma-theme-cyber)"
            exit 1
          fi
          scripts/fetch-themes.sh

      # Forma's ScreenScraper developer account goes into the program, so people only enter
      # their own login. Without these secrets the build still works and asks for an account.
      - name: Build the AppImage, with Cyber, the default theme and the shell as resources
        env:
          FORMA_SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          FORMA_SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
        run: |
          if [ "$FULL" = true ]; then
            npx tauri build --bundles appimage --config \
              '{"bundle":{"active":true,"targets":["appimage"],"resources":{"../../build/themes/cyber":"themes/cyber","../../packages/theme-default/dist":"themes/default","../../packages/shell/dist":"shell"}}}'
          else
            npx tauri build --no-bundle
          fi

      # The update: the program and its resources where the AppImage has them (usr/bin,
      # usr/lib/Forma), for scripts/batocera/update.sh. Its libraries are the installed ones.
      - name: Pack the update
        run: |
          u=build/update
          rm -rf "$u" && mkdir -p "$u/usr/bin" "$u/usr/lib/Forma/themes"
          cp target/release/forma "$u/usr/bin/forma"
          cp -r packages/shell/dist "$u/usr/lib/Forma/shell"
          cp -r build/themes/cyber "$u/usr/lib/Forma/themes/cyber"
          cp -r packages/theme-default/dist "$u/usr/lib/Forma/themes/default"
          tar -C "$u" -czf "forma-${{ matrix.arch }}.tar.gz" usr

      - name: Attach it to the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release upload "$TAG" "forma-${{ matrix.arch }}.tar.gz" --clobber
          [ "$FULL" = true ] || exit 0
          files=(target/release/bundle/appimage/*.AppImage)
          [ -f "${files[0]}" ] || { echo "::error::no AppImage was built"; exit 1; }
          cp "${files[0]}" "forma-${{ matrix.arch }}.AppImage"
          gh release upload "$TAG" "forma-${{ matrix.arch }}.AppImage" --clobber
